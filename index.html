body{background:#f5f5f5;display:flex;flex-direction:column;align-items:center;padding:20px}
/* 3:4固定比例容器，适配所有设备 */
.book-box{
    width: min(90vw, 750px);
    position:relative;
    aspect-ratio: 3 / 4;
}
.page-img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:none;
    border-radius:8px;
    box-shadow:0 2px 15px rgba(0,0,0,0.1);
}
.page-img.active{display:block}
.btn{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:45px;
    height:45px;
    border-radius:50%;
    background:rgba(255,255,255,0.85);
    border:none;
    font-size:22px;
    cursor:pointer;
    z-index:999;
    transition: background 0.2s;
}
.btn:hover{background:#fff}
.prev{left:10px}
.next{right:10px}
.page-num{margin-top:16px;color:#333;font-size:14px}

    <button class="btn prev" onclick="prevPage()">&lt;</button>
    <button class="btn next" onclick="nextPage()">&gt;</button>
</div>
<div class="page-num">当前页：<span id="now">1</span> / 14</div>

<script>
let cur = 0;
const pages = document.querySelectorAll('.page-img');
const total = pages.length;
const numText = document.getElementById('now');

function render(){
    pages.forEach(p=>p.classList.remove('active'));
    pages[cur].classList.add('active');
    numText.innerText = cur+1;
}
function prevPage(){
    cur = cur <=0 ? total-1 : cur-1;
    render();
}
function nextPage(){
    cur = cur >= total-1 ? 0 : cur+1;
    render();
}
// 支持键盘左右键翻页
document.addEventListener('keydown', e=>{
    if(e.key === 'ArrowLeft') prevPage();
    if(e.key === 'ArrowRight') nextPage();
});
window.addEventListener('load', render);
</script>
