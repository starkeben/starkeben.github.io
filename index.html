}
.page-img.active{display:block}

    width:45px;
    height:45px;
    border-radius:50%;
    background:rgba(255,255,255,0.8);
    border:none;
    font-size:22px;
    cursor:pointer;

<div class="page-num">当前页：<span id="now">1</span> / 12</div>
<script>
let cur = 0;
const pages = document.querySelectorAll('.page-img');
const total = pages.length;
const numText = document.getElementById('now');
function render(){
pages.forEach(p=>p.classList.remove('active'));
pages[cur].classList.add('active');
numText.innerText = cur+1;
}
function prevPage(){
cur = cur <=0 ? total-1 : cur-1;
render();
}
function nextPage(){
cur = cur >= total-1 ? 0 : cur+1;
render();
}
window.addEventListener('load', render);
</script>
